openapi: 3.0.3

info:
  title: Scraper API
  description: |
    Containerized scraping microservice — fetch rendered HTML from URLs.

    This API provides endpoints for:
      - Single URL scraping with multiple modes (HTTP, Browser, Auto)
      - Batch scraping of multiple URLs with controlled concurrency
      - Provider-agnostic web search with stable normalized results
      - Async job queuing and management
      - Interactive agent browsing (stateful sessions, tabs, snapshot, click, type, navigate, evaluate)
      - Cache operations (stats, purge, cleanup, vacuum)
      - Health and readiness checks (the deep health check reports the search subsystem)
      - Prometheus-style metrics, including per-provider search counters

    Authentication: API key via Bearer token in Authorization header (required for most endpoints).

  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.yourdomain.com/v1
    description: Production server
  - url: https://staging.yourdomain.com/v1
    description: Staging environment

tags:
   - name: Health
     description: Health and readiness checks
   - name: Monitoring
     description: Metrics and monitoring endpoints
   - name: Scrape
     description: URL scraping endpoints
   - name: Search
     description: Provider-agnostic web search endpoints
   - name: Transcript
     description: Provider-agnostic YouTube transcript (captions) endpoints
   - name: Plugins
     description: Plugin discovery, metadata and observability endpoints
   - name: Cache
     description: Cache management operations
   - name: Jobs
     description: Async job queue management
   - name: Browser
     description: Interactive agent browser API (stateful sessions, tabs, snapshot, actions)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "API-Key"
# =========================================================== SCHEMA DEFINITIONS
  schemas:
    # Health endpoints
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
          default: ok
        version:
          type: string
          default: "1.0.0"
        service:
          type: string
          default: "scraper-api"

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable, not_loaded]
          default: ok
        checks:
          type: object
          additionalProperties: true

    # Plugin endpoints
    PluginInfo:
      type: object
      properties:
        name:
          type: string
          description: Plugin name
        version:
          type: string
          description: Plugin version
        api_version:
          type: string
          nullable: true
          description: Plugin API version
        service_api_version:
          type: string
          nullable: true
          description: Service plugin API version
        status:
          type: string
          enum: [loaded, failed, skipped, disabled]
          description: Plugin status
        reason:
          type: string
          nullable: true
          description: Failure or skip reason
        extensions:
          type: object
          nullable: true
          description: Registered providers by kind

    PluginListResponse:
      type: object
      properties:
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginInfo'
          description: List of plugin metadata
        summary:
          type: object
          properties:
            loaded:
              type: integer
            failed:
              type: integer
            skipped:
              type: integer
        loaded_count:
          type: integer
        failed_count:
          type: integer
        skipped_count:
          type: integer
        status:
          type: string
          enum: [loaded, skipped_all, no_plugins]
        message:
          type: string

    # Scrape endpoints
    ExtractField:
      type: object
      properties:
        selector:
          type: string
          description: CSS selector to locate element(s)
        type:
          type: string
          enum: [text, html, attr, object]
          default: text
          description: Type of value to extract
        attribute:
          type: string
          description: Attribute name for 'attr' type
        multiple:
          type: boolean
          default: false
          description: Return list when true
        default:
          type: object
          description: Fallback value when no match
        required:
          type: boolean
          default: false
          description: Structured error on failure
        absolute_url:
          type: boolean
          default: false
          description: Convert to absolute URL

    ExtractConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Master toggle for extraction
        base_url:
          type: string
          description: Override base URL for relative-to-absolute conversion
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExtractField'

    NormalizeConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Master toggle for HTML normalization. A preset also enables normalization.
        preset:
          type: string
          enum: [light, content, aggressive]
          nullable: true
          description: Optional normalization preset
        absolute_urls:
          type: boolean
          default: false
          description: Convert relative URLs to absolute
        remove_scripts:
          type: boolean
          default: false
          description: Remove <script> elements
        remove_styles:
          type: boolean
          default: false
          description: Remove <style> elements and inline styles
        remove_comments:
          type: boolean
          default: false
          description: Remove HTML comments
        remove_meta:
          type: boolean
          default: false
          description: Remove <meta> elements
        remove_noscript:
          type: boolean
          default: false
          description: Remove <noscript> elements
        remove_data_attrs:
          type: boolean
          default: false
          description: Remove data-* attributes
        remove_hidden:
          type: boolean
          default: false
          description: Remove explicitly hidden nodes
        remove_media:
          type: boolean
          default: false
          description: Remove media and embedded-content tags
        collapse_whitespace:
          type: boolean
          default: false
          description: Reduce whitespace runs to single spaces
        minify:
          type: boolean
          default: false
          description: Compact HTML without breaking semantics

    ProxyConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Master toggle for proxy configuration
        url:
          type: string
          description: Proxy URL (http, https, socks5 schemes)
        country:
          type: string
          description: Country hint for proxy provider

    CookieConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Master toggle for per-request cookies
        header:
          type: string
          maxLength: 20000
          nullable: true
          description: Raw Cookie header value, e.g. session=abc; theme=dark
        netscape:
          type: string
          maxLength: 200000
          nullable: true
          description: Full Netscape cookies.txt content

    HeaderConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Master toggle for per-request custom headers
        values:
          type: object
          additionalProperties:
            type: string
          description: >-
            Header name/value pairs. Allowed names: authorization, referer,
            accept-language, origin, or any name prefixed with 'X-'. Values
            may not contain control characters (CR/LF/NUL) and are limited
            to 4000 characters; at most 20 headers are allowed.

    ScrollConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
        max_scrolls:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
        delay_ms:
          type: integer
          minimum: 100
          maximum: 30000
          default: 1000
        stop_when_no_growth:
          type: boolean
          default: true

    DebugConfig:
      type: object
      properties:
        screenshot:
          type: boolean
          default: false
        html_dump:
          type: boolean
          default: false

    ScrapeRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 8192
          description: Target URL to scrape
        mode:
          type: string
          enum: [http, browser, auto]
          default: auto
          description: Scraping mode (http, browser, or auto)
        cache_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
          description: Per-request cache TTL (60s - 30 days)
        force_refresh:
          type: boolean
          default: false
          description: Bypass cache and fetch fresh content
        wait_until:
          type: string
          enum: [load, domcontentloaded, networkidle, networkidle0]
          default: networkidle
          description: Browser wait strategy (browser mode only)
        wait_selector:
          type: string
          maxLength: 500
          description: CSS selector to wait for before returning (browser mode)
        timeout_seconds:
          type: integer
          minimum: 5
          maximum: 120
          default: 45
          description: Maximum time to wait for page load
        proxy:
          $ref: '#/components/schemas/ProxyConfig'
        cookies:
          $ref: '#/components/schemas/CookieConfig'
        headers:
          $ref: '#/components/schemas/HeaderConfig'
        scroll:
          $ref: '#/components/schemas/ScrollConfig'
        debug:
          $ref: '#/components/schemas/DebugConfig'
        normalize:
          $ref: '#/components/schemas/NormalizeConfig'
        extract:
          $ref: '#/components/schemas/ExtractConfig'

    ScrapeResponse:
      type: object
      properties:
        url:
          type: string
        final_url:
          type: string
        status_code:
          type: integer
        from_cache:
          type: boolean
          default: false
        stale:
          type: boolean
          default: false
        fetched_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        html:
          type: string
          description: Rendered HTML content
        metadata:
          $ref: '#/components/schemas/Metadata'
        extracted:
          type: object
          description: Structured data from CSS selectors
        extraction_error:
          type: object
          description: Error when required extraction field failed

    Metadata:
      type: object
      properties:
        mode:
          type: string
        elapsed_ms:
          type: integer
        content_length:
          type: integer
        cache_key:
          type: string
        normalized:
          type: boolean
          default: false
          description: True when normalization was applied
        normalization:
          type: object
          description: Which features were applied

    V2ScrapeRequest:
      allOf:
        - $ref: '#/components/schemas/ScrapeRequest'
        - type: object
          properties:
            response_format:
              type: string
              enum: [html, text]
              default: html
              description: Format returned in the content field

    V2Metadata:
      allOf:
        - $ref: '#/components/schemas/Metadata'
        - type: object
          properties:
            response_format:
              type: string
              enum: [html, text]
              default: html
              description: Format of the returned content field

    V2ScrapeResponse:
      type: object
      properties:
        url:
          type: string
        final_url:
          type: string
        status_code:
          type: integer
        from_cache:
          type: boolean
          default: false
        stale:
          type: boolean
          default: false
        fetched_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        content:
          type: string
          description: Scraped content in the requested response_format
        metadata:
          $ref: '#/components/schemas/V2Metadata'
        extracted:
          type: object
          description: Structured data from CSS selectors
        extraction_error:
          type: object
          description: Error when required extraction field failed

    BatchItem:
      type: object
      required: [url, mode]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 8192
        mode:
          type: string
          enum: [http, browser, auto]
          default: auto
        cache_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
        force_refresh:
          type: boolean
          default: false
        wait_until:
          type: string
          enum: [load, domcontentloaded, networkidle, networkidle0]
          default: networkidle
        wait_selector:
          type: string
          maxLength: 500
        timeout_seconds:
          type: integer
          minimum: 5
          maximum: 120
          default: 45
        proxy:
          $ref: '#/components/schemas/ProxyConfig'
        cookies:
          $ref: '#/components/schemas/CookieConfig'
        headers:
          $ref: '#/components/schemas/HeaderConfig'
        scroll:
          $ref: '#/components/schemas/ScrollConfig'
        debug:
          $ref: '#/components/schemas/DebugConfig'
        normalize:
          $ref: '#/components/schemas/NormalizeConfig'
        extract:
          $ref: '#/components/schemas/ExtractConfig'

    BatchScrapeRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchItem'
          minimum: 1
          maximum: 50
        max_concurrency:
          type: integer
          minimum: 1
          maximum: 10
          default: 3

    BatchResult:
      type: object
      properties:
        url:
          type: string
        success:
          type: boolean
        result:
          $ref: '#/components/schemas/ScrapeResponse'
        error:
          type: object

    BatchScrapeResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchResult'
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        elapsed_ms:
          type: integer

    CacheStats:
      type: object
      properties:
        total_entries:
          type: integer
        total_size_bytes:
          type: integer
        expired_entries:
          type: integer
        cache_path:
          type: string

    PurgeResponse:
      type: object
      properties:
        purged_entries:
          type: integer
        message:
          type: string

    CacheCleanupRequest:
      type: object
      properties:
        delete_expired_after_seconds:
          type: integer
        max_entries:
          type: integer
        max_size_mb:
          type: integer
        vacuum:
          type: boolean

    CacheVacuumResult:
      type: object
      properties:
        size_after_bytes:
          type: integer

    CacheCleanupResult:
      type: object
      properties:
        total_deleted:
          type: integer
        size_after_bytes:
          type: integer
        entries_after:
          type: integer

    # Job endpoints
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    JobResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        result:
          type: object
        error:
          type: object
        profile_name:
          type: string
          description: Authenticated profile name (optional)

    JobListResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobResponse'
        total:
          type: integer

    # Search endpoints
    TranscriptApiResponse:
      type: object
      description: Normalized, provider-agnostic transcript response
      required:
        - video_id
        - segments
        - text
        - total_words
        - provider
        - metadata
      properties:
        video_id:
          type: string
        title:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
          description: Language actually served (first requested tag that matched)
        is_generated:
          type: boolean
          description: True when the transcript is auto-generated captions, not manual
        provider:
          type: string
          description: Provider that produced this transcript
        segments:
          type: array
          items:
            type: object
            required: [start, text]
            properties:
              start:
                type: number
              duration:
                type: number
              text:
                type: string
        text:
          type: string
          description: Full transcript text (segments joined)
        total_words:
          type: integer
        metadata:
          type: object
          required: [provider]
          properties:
            provider:
              type: string
            providers_attempted:
              type: array
              items:
                type: string
            fallback_occurred:
              type: boolean
            elapsed_ms:
              type: integer
            from_cache:
              type: boolean
            stale:
              type: boolean
            cached_at:
              type: string
              format: date-time
              nullable: true
            cache_age_seconds:
              type: number
              nullable: true
            warnings:
              type: array
              items:
                type: string
            auth_profile:
              type: string
              nullable: true

    SearchRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
          description: The search query (1-1000 characters, must contain text)
        verticals:
          type: array
          minItems: 1
          items:
            type: string
            enum: [web, news, images, videos, social, it, science, maps, music, files]
          default: [web]
          description: Verticals to search (additive, no duplicates). Each result is tagged with its vertical
        language:
          type: string
          nullable: true
          pattern: '^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$'
          description: Optional BCP-47 style language tag, e.g. "en" or "en-US"
        time_range:
          type: string
          enum: [day, week, month, year]
          nullable: true
          description: Restrict results to this time range
        safe_search:
          type: string
          enum: [off, moderate, strict]
          default: moderate
          description: Safe-search filtering level
        page:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: Result page number (1-based)
        limit:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          description: Maximum number of results to return (1-100)
        sources:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: Optional preferred underlying sources (no duplicates). Semantics are provider-defined; see the capabilities endpoint
        provider:
          type: string
          minLength: 1
          maxLength: 100
          default: auto
          description: Provider name to use, or "auto" to let the service pick an available provider
        cache_ttl_seconds:
          type: integer
          nullable: true
          minimum: 60
          maximum: 2592000
          description: Per-request cache TTL (60s - 30 days)
        force_refresh:
          type: boolean
          default: false
          description: If true, bypass the cache and query the provider fresh

    SearchApiResult:
      type: object
      required: [title, url, rank, vertical, provider]
      properties:
        title:
          type: string
          description: Result title
        url:
          type: string
          description: Absolute http(s) URL of the result
        snippet:
          type: string
          nullable: true
          description: Short summary or description, when the provider offers one
        rank:
          type: integer
          minimum: 1
          description: 1-based rank within its vertical
        vertical:
          type: string
          enum: [web, news, images, videos, social, it, science, maps, music, files]
          description: Vertical this result belongs to (normalized vocabulary)
        source:
          type: string
          nullable: true
          description: Underlying source (e.g. a specific search engine), when known
        provider:
          type: string
          description: Provider that produced this result
        thumbnail_url:
          type: string
          nullable: true
          description: Optional thumbnail image URL
        published_at:
          type: string
          format: date-time
          nullable: true
          description: Optional publication timestamp, when known

    SearchPagination:
      type: object
      properties:
        page:
          type: integer
          nullable: true
          minimum: 1
          description: Current result page, when the provider paginates
        has_more:
          type: boolean
          nullable: true
          description: Whether further pages exist. null when the provider does not report a total page count
        total_pages:
          type: integer
          nullable: true
          minimum: 1
          description: Total number of pages, when the provider reports it
        total_results:
          type: integer
          nullable: true
          minimum: 0
          description: Estimated total number of matching results, if reported

    SearchApiMetadata:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          description: Provider that produced this response
        providers_attempted:
          type: array
          items:
            type: string
          description: Providers attempted in order, including failed ones
        fallback_occurred:
          type: boolean
          default: false
          description: True when the router fell back after a transient failure
        from_cache:
          type: boolean
          default: false
          description: True when the response was served from the search cache
        stale:
          type: boolean
          default: false
          description: True when a stale (expired) cache entry was served on error
        cached_at:
          type: string
          format: date-time
          nullable: true
          description: When the cached entry serving this response was created (null for fresh responses)
        cache_age_seconds:
          type: number
          nullable: true
          minimum: 0
          description: Age of the served entry in seconds when from_cache is true (null for fresh responses)
        elapsed_ms:
          type: integer
          minimum: 0
          default: 0
          description: Time spent serving, in ms
        warnings:
          type: array
          items:
            type: string
          description: Human-readable warnings (degradations, fallbacks, ...)
        degraded_capabilities:
          type: array
          items:
            type: string
          description: Machine-readable tokens for requested features the provider could not fully honor
        auth_profile:
          type: string
          nullable: true
          description: Authenticated profile name, present only when profile exposure is enabled

    SearchApiResponse:
      type: object
      required: [query, results, pagination, metadata]
      properties:
        query:
          type: string
          description: Echo of the requested query
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchApiResult'
          description: Normalized results, ordered by rank within each vertical
        pagination:
          $ref: '#/components/schemas/SearchPagination'
        metadata:
          $ref: '#/components/schemas/SearchApiMetadata'

    SearchFilters:
      type: object
      properties:
        language:
          type: boolean
          default: false
          description: Filter results by language tag
        safe_search:
          type: boolean
          default: false
          description: Apply safe-search filtering
        time_range:
          type: boolean
          default: false
          description: Restrict results to a time range
        paging:
          type: boolean
          default: false
          description: Serve arbitrary result pages
        source_selection:
          type: boolean
          default: false
          description: Restrict results to specific sources

    SearchProviderCapabilities:
      type: object
      required: [name, available]
      properties:
        name:
          type: string
          description: Stable provider identifier
        available:
          type: boolean
          description: Provider health. false when the provider is down or its capabilities probe failed
        verticals:
          type: array
          items:
            type: string
          description: Normalized verticals this provider can search (empty when unknown)
        time_ranges:
          type: array
          items:
            type: string
            enum: [day, week, month, year]
          description: Time-range filters this provider supports (empty when none)
        filters:
          $ref: '#/components/schemas/SearchFilters'
        max_results:
          type: integer
          nullable: true
          minimum: 1
          description: Hard cap on results per request, when the provider has one
        sources:
          type: array
          nullable: true
          items:
            type: string
          description: Selectable source names, when the provider can discover them (null = not discoverable)
        warnings:
          type: array
          items:
            type: string
          description: Human-readable notes, e.g. a failed capabilities probe

    SearchCacheCapabilities:
      type: object
      required: [enabled, default_ttl_seconds, stale_if_error]
      properties:
        enabled:
          type: boolean
          description: Whether the search result cache is on
        default_ttl_seconds:
          type: integer
          minimum: 0
          description: TTL for cached entries when the request sets none (0 = never expires)
        stale_if_error:
          type: boolean
          description: Whether expired entries are served when the live search fails

    SearchCapabilitiesResponse:
      type: object
      required: [default_provider, providers, cache]
      properties:
        default_provider:
          type: string
          description: Routing behaviour for provider=auto requests
        provider_order:
          type: array
          items:
            type: string
          description: Routing priority for auto mode (registered providers)
        providers:
          type: array
          items:
            $ref: '#/components/schemas/SearchProviderCapabilities'
          description: Enabled providers, in routing priority order
        verticals:
          type: array
          items:
            type: string
          description: Normalized verticals usable with provider=auto (union across available providers)
        time_ranges:
          type: array
          items:
            type: string
            enum: [day, week, month, year]
          description: Time-range filters usable with provider=auto (union across available providers)
        filters:
          $ref: '#/components/schemas/SearchFilters'
        safe_search_levels:
          type: array
          items:
            type: string
            enum: [off, moderate, strict]
          description: Normalized safe-search levels accepted by the request
        cache:
          $ref: '#/components/schemas/SearchCacheCapabilities'

    # Error models
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
            message:
              type: string
            details:
              type: object

    AuthErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Error detail message

    # Interactive agent browser endpoints
    BrowserProviderMetadata:
      type: object
      properties:
        provider:
          type: string
          description: Backend provider serving the session (e.g. "camofox"). Never a raw upstream ID.

    BrowserTab:
      type: object
      properties:
        tab_id:
          type: string
        url:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
          format: date-time
      required: [tab_id]

    BrowserSession:
      type: object
      properties:
        session_id:
          type: string
        provider:
          type: string
        tabs:
          type: array
          items:
            $ref: '#/components/schemas/BrowserTab'
        created_at:
          type: string
          nullable: true
          format: date-time
        last_activity_at:
          type: string
          nullable: true
          format: date-time
        expires_at:
          type: string
          nullable: true
          format: date-time
      required: [session_id, provider, tabs]

    BrowserSessionCreatedResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/BrowserSession'
      required: [session]

    BrowserSessionDeletedResponse:
      type: object
      properties:
        session_id:
          type: string
        message:
          type: string
      required: [session_id, message]

    BrowserTabCreatedResponse:
      type: object
      properties:
        session_id:
          type: string
        tab:
          $ref: '#/components/schemas/BrowserTab'
      required: [session_id, tab]

    BrowserTabDeletedResponse:
      type: object
      properties:
        session_id:
          type: string
        tab_id:
          type: string
        message:
          type: string
      required: [session_id, tab_id, message]

    BrowserLink:
      type: object
      properties:
        url:
          type: string
        text:
          type: string
          default: ""
      required: [url]

    SnapshotResponse:
      type: object
      properties:
        session_id:
          type: string
        tab_id:
          type: string
        url:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        snapshot:
          type: string
          description: Normalized accessible text/tree with stable element refs.
        refs_count:
          type: integer
        truncated:
          type: boolean
        has_more:
          type: boolean
        next_offset:
          type: integer
          nullable: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/BrowserLink'
        provider:
          $ref: '#/components/schemas/BrowserProviderMetadata'
      required: [session_id, tab_id, snapshot, refs_count, truncated, has_more, links, provider]

    BrowserNavigateRequest:
      type: object
      properties:
        url:
          type: string
        timeout_seconds:
          type: number
          nullable: true
      required: [url]

    BrowserNavigateResponse:
      type: object
      properties:
        session_id:
          type: string
        tab_id:
          type: string
        ok:
          type: boolean
        url:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        provider:
          $ref: '#/components/schemas/BrowserProviderMetadata'
      required: [session_id, tab_id, ok, provider]

    BrowserClickRequest:
      type: object
      properties:
        ref:
          type: string
          nullable: true
        selector:
          type: string
          nullable: true
      description: Provide exactly one of ``ref`` (snapshot ref) or ``selector`` (CSS).

    BrowserClickResponse:
      type: object
      properties:
        session_id:
          type: string
        tab_id:
          type: string
        ok:
          type: boolean
        url:
          type: string
          nullable: true
        provider:
          $ref: '#/components/schemas/BrowserProviderMetadata'
      required: [session_id, tab_id, ok, provider]

    BrowserTypeRequest:
      type: object
      properties:
        text:
          type: string
        ref:
          type: string
          nullable: true
        selector:
          type: string
          nullable: true
      required: [text]

    BrowserTypeResponse:
      type: object
      properties:
        session_id:
          type: string
        tab_id:
          type: string
        ok:
          type: boolean
        url:
          type: string
          nullable: true
        provider:
          $ref: '#/components/schemas/BrowserProviderMetadata'
      required: [session_id, tab_id, ok, provider]

    BrowserEvaluateRequest:
      type: object
      properties:
        expression:
          type: string
        timeout_ms:
          type: integer
          nullable: true
      required: [expression]

    BrowserEvaluateResponse:
      type: object
      properties:
        session_id:
          type: string
        tab_id:
          type: string
        ok:
          type: boolean
        result:
          type: object
          nullable: true
        result_type:
          type: string
          nullable: true
        truncated:
          type: boolean
        error:
          type: string
          nullable: true
        error_type:
          type: string
          nullable: true
        provider:
          $ref: '#/components/schemas/BrowserProviderMetadata'
      required: [session_id, tab_id, ok, truncated, provider]

    BrowserCapabilitiesResponse:
      type: object
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          nullable: true
        evaluate_enabled:
          type: boolean
        max_sessions:
          type: integer
        max_tabs_per_session:
          type: integer
        session_ttl_seconds:
          type: integer
      required: [enabled, evaluate_enabled, max_sessions, max_tabs_per_session, session_ttl_seconds]

paths:
   /health:
     get:
       operationId: healthCheck
       summary: Liveness check
       description: |
         Always returns 200 when the service is running. Deliberately I/O-free:
         it never touches the cache or any external dependency (including search
         providers), so liveness stays cheap. No authentication required.
       tags: [Health]
       security: []
       responses:
         '200':
           description: Service is healthy
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/HealthResponse'
         '401':
           description: Not authorized

   /health/deep:
     get:
       operationId: deepHealthCheck
       summary: Deep health check
       description: |
         Deep health check for container restart policy. Verifies internal
         dependencies (config, cache) and recent scrape error patterns.

         The `checks.search` object reports the search subsystem:
         - `status`: `ok`, `no providers configured`, or `degraded (no provider available)`
         - `configured`: whether the search subsystem is present
         - `cache_enabled`: whether the search result cache is on
         - `providers`: per-provider report — `name`, `available` (from a bounded capabilities probe), `probe` (`ok`/`failed`), plus provider diagnostics (e.g. SearXNG's `/config` discovery state)

         External backends (search providers, Camofox) are **reported but non-fatal**:
         a down backend degrades the reported status but never fails the check, so the
         restart policy never depends on an external service.  Only local infrastructure
         problems (missing cache or missing search subsystem) fail the check. No
         authentication required.
         
         The `checks.camofox` object reports the external Camofox service when the
         `camofox` client is enabled: `status` (`ok`/`unreachable`), `reason`,
         `version`, `browser_connected`, `pool_size` (from the service's cheap
         unauthenticated health probe); `disabled` when the client is off.
       tags: [Health]
       security: []
       responses:
         '200':
           description: Internal checks are healthy
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ReadinessResponse'
               examples:
                 searchSubsystemOk:
                   summary: Search subsystem healthy (SearXNG discovered)
                   value:
                     status: ok
                     checks:
                       config: ok
                       cache: ok
                       scrape_errors: ok
                       search:
                         status: ok
                         configured: true
                         cache_enabled: true
                         providers:
                           - name: searxng
                             available: true
                             probe: ok
                             base_url_configured: true
                             discovery_state: ok
                             discovery_age_seconds: 12.5
                             config_cache_ttl_seconds: 3600
                             enabled_engines: 23
                             instance_version: "5.0.0"
                       camofox:
                         status: unreachable
                         reason: connection refused
                         version: null
                         browser_connected: null
                         pool_size: null
         '401':
           description: Not authorized
         '503':
           description: One or more internal checks are degraded
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ReadinessResponse'
               examples:
                 searchSubsystemMissing:
                   summary: Search subsystem not initialized (local configuration problem)
                   value:
                     status: degraded
                     checks:
                       config: ok
                       cache: ok
                       scrape_errors: ok
                       search: unavailable

   /ready:
     get:
       operationId: readinessCheck
       summary: Readiness probe
       description: Verifies config and cache are initialized. Requires authentication for metrics collection. For search subsystem diagnostics use `/health/deep`.
       tags: [Health]
       security:
         - bearerAuth: []
       responses:
         '200':
           description: All services ready
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ReadinessResponse'
         '401':
           description: Not authorized
         '503':
           description: Service degraded

   /metrics:
     get:
       operationId: getMetrics
       summary: Prometheus-style metrics
       description: |
         Returns Prometheus-formatted text metrics for monitoring. No authentication required.

         Search metrics:
         - `search_requests_total`, `search_success_total`, `search_error_total`
         - `search_cache_hits_total`, `search_cache_misses_total`, `search_cache_stale_hits_total`, `search_cache_errors_total`
         - `search_duration_ms_sum` (sum for average latency)
         - `search_fallbacks_total` (auto-mode provider fallbacks)
         - `search_provider_attempts_total`, `search_provider_success_total`, `search_provider_error_total` — labelled only by the bounded, operator-configured `provider` name

         Label hygiene: user input (query text, result URLs) never appears in labels.
       tags: [Monitoring]
       security: []
       responses:
         '200':
           description: Text metrics response
           content:
             text/plain:
               schema:
                 type: string
               example: |
                 # HELP search_requests_total Total search requests received
                 # TYPE search_requests_total counter
                 search_requests_total 42
                 # HELP search_provider_attempts_total Search attempts made, by provider
                 # TYPE search_provider_attempts_total counter
                 search_provider_attempts_total{provider="searxng"} 39
         '401':
           description: Not authorized

   # ====================================================== Scrape Endpoints
   /v1/scrape:
     post:
       operationId: scrapeUrl
       summary: Scrape single URL
       description: |
         Scrape a single URL and return its rendered HTML. Supports multiple modes:

           - **http**: Uses standard HTTP headers (headless browser)
           - **browser**: Uses headless Chrome/Chromium with full JavaScript execution
           - **auto**: Auto-detects based on user-agent and content

         Request body fields:
           - url: Target URL to scrape
           - mode: Scraping mode (http, browser, or auto)
           - cache_ttl_seconds: TTL for caching (60s - 30 days)
           - force_refresh: Bypass cache if true
           - wait_until: Browser wait strategy
           - wait_selector: CSS selector to wait for
           - timeout_seconds: Max time to wait (5-120s)
           - proxy: Proxy configuration for this request
           - scroll: Scroll settings for JS-rendered pages
           - debug: Debug output controls
           - normalize: HTML normalization options
           - extract: CSS selector extraction config

         Authentication: Required unless API key is disabled in config.

       tags: [Scrape]
       security:
         - bearerAuth: []
       requestBody:
         required: true
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/ScrapeRequest'
       responses:
         '200':
           description: Successful scrape
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ScrapeResponse'
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

         '422':
           description: Validation error
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   /v2/scrape:
     post:
       operationId: scrapeUrlV2
       summary: Scrape single URL (v2)
       description: |
         Scrape a single URL and return ``content`` in the requested
         ``response_format``. Unlike ``/v1/scrape``, this endpoint does not
         overload the ``html`` field for non-HTML formats.

       tags: [Scrape]
       security:
         - bearerAuth: []
       requestBody:
         required: true
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/V2ScrapeRequest'
       responses:
         '200':
           description: Successful scrape
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/V2ScrapeResponse'
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '422':
           description: Validation error
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   /v1/scrape/batch:
     post:
       operationId: scrapeBatch
       summary: Scrape multiple URLs
       description: |
         Scrape multiple URLs with controlled concurrency. Returns results individually
         so failed items don't block others.

         Request body fields:
           - items: Array of up to 50 URLs with per-item options
           - max_concurrency: Max concurrent requests (1-10)

         Each item can have its own mode, proxy, scroll config, etc.

       tags: [Scrape]
       security:
         - bearerAuth: []
       requestBody:
         required: true
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/BatchScrapeRequest'
       responses:
         '200':
           description: Batch scraping complete
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/BatchScrapeResponse'
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '422':
           description: Validation error
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   # ====================================================== Search Endpoints
   /v1/search:
     post:
       operationId: search
       summary: Search the web (provider-agnostic)
       description: |
         Run a normalized web search and return stable, provider-agnostic results.

         The request uses service-level concepts only (query, verticals, language,
         time range, safe search, page, limit, sources, provider); provider-specific
         parameter names are rejected. Results are normalized into a stable shape
         with pagination and metadata — raw provider payloads never appear.

         When `provider` is `auto` (the default), the service selects a healthy
         provider whose capabilities satisfy the request and falls back on
         transient failures (fallbacks are reported in `metadata`).

         Authentication: Required unless API key is disabled in config.

       tags: [Search]
       security:
         - bearerAuth: []
       requestBody:
         required: true
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/SearchRequest'
       responses:
         '200':
           description: Normalized search results
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SearchApiResponse'
         '400':
           description: Unknown provider or unsatisfiable capabilities for the explicitly requested provider
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '422':
           description: Request validation error
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '503':
           description: No provider is available (none configured, or all failed)
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '504':
           description: Provider timed out
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   /v1/search/capabilities:
     get:
       operationId: searchCapabilities
       summary: Search capabilities
       description: |
         Service-level search capabilities: enabled providers (in routing
         priority order), the normalized verticals and filters usable in auto
         mode, discoverable per-provider sources, safe-search levels, and the
         search result cache policy.

         This is an aggregate owned by this service; it does not proxy a
         provider's own configuration/discovery endpoint.

         Authentication: Required unless API key is disabled in config.

       tags: [Search]
       security:
         - bearerAuth: []
       responses:
         '200':
           description: Capabilities report
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SearchCapabilitiesResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   /v1/transcript:
     get:
       operationId: transcript
       summary: Fetch the transcript (captions) of a YouTube video
       description: |
         Fetch a normalized, provider-agnostic transcript for a YouTube video.

         Identify the video with `url` (any YouTube URL form: watch, shorts,
         youtu.be, embed, live) or `video_id`. `lang` is a comma-separated list
         of preferred caption language tags; `provider` selects a transcript
         backend (default `auto` = ordered fallback chain, explicit names never
         fall back silently). Results are cached; `cache_ttl_seconds` overrides
         the cache TTL for this response and `force_refresh` bypasses the cache.

         Authentication: Required unless API key is disabled in config.

       tags: [Transcript]
       security:
         - bearerAuth: []
       parameters:
         - name: url
           in: query
           required: false
           description: "YouTube URL (watch/shorts/youtu.be/embed/live) or bare video ID"
           schema:
             type: string
         - name: video_id
           in: query
           required: false
           description: YouTube video ID (alternative to `url`)
           schema:
             type: string
             pattern: '^[A-Za-z0-9_-]{11}$'
         - name: lang
           in: query
           required: false
           description: "Preferred caption languages, comma-separated (e.g. `es,en`; default `en`)"
           schema:
             type: string
             default: ""
         - name: provider
           in: query
           required: false
           description: Transcript provider name, or `auto` for the fallback chain (default)
           schema:
             type: string
             default: auto
         - name: cache_ttl_seconds
           in: query
           required: false
           description: Cache TTL override in seconds for this response (minimum 60)
           schema:
             type: integer
             minimum: 60
         - name: force_refresh
           in: query
           required: false
           description: Bypass the result cache and re-fetch
           schema:
             type: boolean
             default: false
       responses:
         '200':
           description: Normalized transcript (segments + full text + metadata)
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/TranscriptApiResponse'
         '400':
           description: Invalid request (missing/bad url, non-YouTube video, unknown provider)
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '403':
           description: Transcript request blocked by the provider (e.g. IP block)
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '404':
           description: Video unavailable, or no transcript/captions for the requested language
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '502':
           description: Provider returned an unusable payload
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '503':
           description: No transcript provider is available (none configured, or all down)
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '504':
           description: Transcript provider timed out
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   # ======================================================= Cache Endpoints
   /v1/cache/stats:
     get:
       operationId: cacheStats
       summary: Cache statistics
       description: Returns current cache statistics (entries, size, expired count).
       tags: [Cache]
       security:
         - bearerAuth: []
       responses:
         '200':
           description: Cache stats returned
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/CacheStats'
         '401':
           description: Not authorized

   /v1/cache/{url}:
     delete:
       operationId: deleteCacheEntry
       summary: Delete single cache entry
       description: Remove a specific URL from the cache. Returns number of entries deleted.
       tags: [Cache]
       security:
         - bearerAuth: []
       parameters:
         - name: url
           in: path
           required: true
           schema:
             type: string
           description: URL to remove from cache
       responses:
         '200':
           description: Entry deleted successfully
           content:
             application/json:
               schema:
                 type: object
                 properties:
                   message:
                     type: string
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '404':
           description: URL not found in cache

   /v1/cache/purge:
     post:
       operationId: purgeCache
       summary: Purge cache entries
       description: |
         Remove all (or domain-scoped) entries from the cache.

         Body field:
           - domain: Optional domain to scope the purge (e.g., "example.com")

       tags: [Cache]
       security:
         - bearerAuth: []
       requestBody:
         required: false
         content:
           application/json:
             schema:
               type: object
               properties:
                 domain:
                   type: string
                   description: Optional domain scope (omit to purge all)
       responses:
         '200':
           description: Cache purged successfully
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/PurgeResponse'
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   /v1/cache/cleanup:
     post:
       operationId: cleanupCache
       summary: Run cache cleanup
       description: |
         Immediately run cache cleanup with optional overrides.

         Optional body fields (defaults to global config):
           - delete_expired_after_seconds: Delete entries older than this
           - max_entries: Max entries to keep
           - max_size_mb: Max total size in MB
           - vacuum: Run VACUUM to reclaim space

       tags: [Cache]
       security:
         - bearerAuth: []
       requestBody:
         required: false
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/CacheCleanupRequest'
       responses:
         '200':
           description: Cleanup completed
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/CacheCleanupResult'
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   /v1/cache/vacuum:
     post:
       operationId: vacuumCache
       summary: Vacuum cache disk space
       description: Run SQLite VACUUM to reclaim disk space. Prefer during maintenance windows.
       tags: [Cache]
       security:
         - bearerAuth: []
       responses:
         '200':
           description: Vacuum completed
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/CacheVacuumResult'
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   # ======================================================= Job Endpoints
# ============================================================ /v1/plugins/status
   /v1/plugins/status:
     get:
       operationId: pluginsStatus
       summary: Plugin loading status
       description: |
         Return plugin loading status and metadata.

         Reports which plugins were successfully loaded, skipped, or failed,
         along with allowlist/denylist configuration and failure isolation mode.
         This endpoint helps operators diagnose plugin loading issues and verify
         that expected plugins are active.
       tags: [Plugins]
       responses:
         '200':
           description: Plugin status report
         '401':
           description: Not authorized
         '403':
           description: Forbidden
           content:
             application/json:
               schema:
                 type: object
                 properties:
                   loaded:
                     type: array
                     items:
                       type: string
                   skipped:
                     type: array
                     items:
                       type: object
                   failed:
                     type: array
                     items:
                       type: object
                   enabled:
                     type: array
                     items:
                       type: string
                   on_error:
                     type: string
                     enum: [fail, warn]
                   allowlist_enabled:
                     type: boolean
                   allowlist:
                     type: array
                     nullable: true
                     items:
                       type: string
                   denylist:
                     type: array
                     items:
                       type: string
                   status:
                     type: string
                     enum: [loaded, skipped_all, no_plugins, not_loaded]
                   message:
                     type: string

# ============================================================ /v1/plugins
   /v1/plugins:
     get:
       operationId: pluginsList
       summary: Plugin metadata list
       description: |
         Return detailed plugin metadata and registration info.

         This endpoint provides richer information than /v1/plugins/status,
         including API versions, registered providers, and per-plugin status.
       tags: [Plugins]
       security:
         - bearerAuth: []
       responses:
         '200':
           description: Plugin metadata list
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/PluginListResponse'
         '401':
           description: Unauthorized
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/AuthErrorResponse'

   /v1/jobs:
     post:
       operationId: createJob
       summary: Create async scrape job
       description: |
         Queue a new async scrape job for background processing.

         The request body is identical to `/v1/scrape`. The job is queued immediately
         and processed by a background worker. Poll `/v1/jobs/{job_id}` for results.

         Requires API key authentication unless disabled in config.

       tags: [Jobs]
       security:
         - bearerAuth: []
       requestBody:
         required: true
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/ScrapeRequest'
       responses:
         '200':
           description: Job created successfully
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/JobResponse'
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '422':
           description: Validation error
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '503':
           description: Async jobs are disabled

     get:
       operationId: listJobs
       summary: List all jobs
       description: Returns all async jobs (newest first) with their current status.
       tags: [Jobs]
       security:
         - bearerAuth: []
       responses:
         '200':
           description: List of jobs
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/JobListResponse'
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   /v2/jobs:
     post:
       operationId: createJobV2
       summary: Create async scrape job (v2)
       description: |
         Queue a new async scrape job using the v2 scrape contract. Results are
         stored with ``content`` when ``response_format`` is provided, matching
         ``/v2/scrape``.

       tags: [Jobs]
       security:
         - bearerAuth: []
       requestBody:
         required: true
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/V2ScrapeRequest'
       responses:
         '200':
           description: Job created successfully
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/JobResponse'
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '422':
           description: Validation error
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '503':
           description: Async jobs are disabled

     get:
       operationId: listJobsV2
       summary: List all jobs (v2 alias)
       description: Returns all async jobs (newest first) with their current status.
       tags: [Jobs]
       security:
         - bearerAuth: []
       responses:
         '200':
           description: List of jobs
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/JobListResponse'
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   /v1/jobs/{job_id}:
     get:
       operationId: getJob
       summary: Get job status
       description: |
         Return the current state and result of an async job.

         Required path parameter: `job_id`

         When authentication is enabled and expose_profile_in_response is true,
         includes the profile_name field.

       tags: [Jobs]
       security:
         - bearerAuth: []
       parameters:
         - name: job_id
           in: path
           required: true
           schema:
             type: string
           description: Job ID to retrieve
       responses:
         '200':
           description: Job details returned
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/JobResponse'
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '404':
           description: Job not found

     delete:
       operationId: deleteJob
       summary: Delete job
       description: Remove an async job from the store. Returns confirmation message.
       tags: [Jobs]
       security:
         - bearerAuth: []
       parameters:
         - name: job_id
           in: path
           required: true
           schema:
             type: string
           description: Job ID to delete
       responses:
         '200':
           description: Job deleted successfully
           content:
             application/json:
               schema:
                 type: object
                 properties:
                   message:
                     type: string
         '400':
           description: Bad Request
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '404':
           description: Job not found

   /v1/jobs/{job_id}/cancel:
