   # ====================================================== Browser Endpoints

   /v1/browser/sessions:
     post:
       operationId: createBrowserSession
       summary: Create a browser session
       description: |
         Create a new interactive browser session owned by the authenticated
         profile. Returns a service-owned `session_id` (a `ses_` ID). The
         backend (Camofox) session is created on demand; provider identifiers
         never appear in the response.
       tags: [Browser]
       security:
         - bearerAuth: []
       responses:
         '201':
           description: Session created
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/BrowserSessionCreatedResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '409':
           description: Session limit reached for this profile
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '502':
           description: Browser provider failure
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '503':
           description: Interactive browser API is not enabled
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   /v1/browser/sessions/{session_id}:
     get:
       operationId: getBrowserSession
       summary: Get browser session state
       description: Return the current state of one of the caller's sessions, including open tabs.
       tags: [Browser]
       security:
         - bearerAuth: []
       parameters:
         - name: session_id
           in: path
           required: true
           schema:
             type: string
           description: Service-owned session ID (`ses_...`)
       responses:
         '200':
           description: Session details
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/BrowserSession'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '404':
           description: Session not found (unknown or not owned by the profile)
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '410':
           description: Session expired (idle TTL elapsed)
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
     delete:
       operationId: deleteBrowserSession
       summary: Close a browser session
       description: Close a session and all of its tabs, releasing the underlying browser.
       tags: [Browser]
       security:
         - bearerAuth: []
       parameters:
         - name: session_id
           in: path
           required: true
           schema:
             type: string
           description: Service-owned session ID (`ses_...`)
       responses:
         '200':
           description: Session closed
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/BrowserSessionDeletedResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '404':
           description: Session not found
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '410':
           description: Session expired
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   /v1/browser/sessions/{session_id}/tabs:
     post:
       operationId: createBrowserTab
       summary: Create a tab in a session
       description: |
         Create a tab in a session. Optionally open a URL, which is validated
         against the profile's SSRF and domain-allowlist rules before the tab
         is created.
       tags: [Browser]
       security:
         - bearerAuth: []
       parameters:
         - name: session_id
           in: path
           required: true
           schema:
             type: string
           description: Service-owned session ID (`ses_...`)
         - name: url
           in: query
           required: false
           schema:
             type: string
           description: URL to open in the new tab (validated by security rules)
       responses:
         '201':
           description: Tab created
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/BrowserTabCreatedResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '403':
           description: URL rejected by security rules (SSRF / domain policy)
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '404':
           description: Session not found
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '409':
           description: Tab limit reached for the session
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '410':
           description: Session expired
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '502':
           description: Browser provider failure
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

   /v1/browser/sessions/{session_id}/tabs/{tab_id}:
     delete:
       operationId: deleteBrowserTab
       summary: Close a tab
       description: Close a single tab in a session.
       tags: [Browser]
       security:
         - bearerAuth: []
       parameters:
         - name: session_id
           in: path
           required: true
           schema:
             type: string
         - name: tab_id
           in: path
           required: true
           schema:
             type: string
       responses:
         '200':
           description: Tab closed
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/BrowserTabDeletedResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '404':
           description: Session or tab not found
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '410':
           description: Session expired
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '502':
           description: Browser provider failure
           content:
             application/json:
               schema:
