   /v1/browser/sessions/{session_id}/tabs/{tab_id}/snapshot:
     get:
       operationId: snapshotBrowserTab
       summary: Snapshot a page
       description: |
         Return a normalized page snapshot (accessible text/tree with stable
         element refs, current URL and title, and optional extracted links).
       tags: [Browser]
       security:
         - bearerAuth: []
       parameters:
         - name: session_id
           in: path
           required: true
           schema:
             type: string
         - name: tab_id
           in: path
           required: true
           schema:
             type: string
         - name: include_links
           in: query
           required: false
           schema:
             type: boolean
             default: false
           description: Also extract page links
         - name: links_limit
           in: query
           required: false
           schema:
             type: integer
             default: 50
             minimum: 1
             maximum: 500
       responses:
         '200':
           description: Page snapshot
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/SnapshotResponse'
         '401':
           description: Missing or invalid API key
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
         '404':
           description: Session or tab not found
           content:
