name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 🟢 Integración Oficial Redocly (Corrección 404)
      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Validate OpenAPI specification
        run: redocly lint openapi.yaml --format=github-actions

      # Continuación de tus pasos de Python
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --ignore=tests/test_transcript_youtube_transcript_api_provider.py --ignore=tests/test_transcript_ytdlp_provider.py --ignore=tests/test_agent_browser_coverage.py --ignore=tests/test_agent_browser_router.py --ignore=tests/test_integration_agent_browser.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  derived-image:
    name: Derived image smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: docker pull ghcr.io/javiyt/scrapping-service:latest

      - name: Build derived example image
        working-directory: docs/examples/plugins
        run: docker buildx build --load -t scrapping-service-plugin-example .

      - name: Smoke test — plugin is active at startup
        run: |
          docker run --rm --user root -e LOG_LEVEL=info -e SCRAPER_API_KEY=smoke-test-key scrapping-service-plugin-example python -c "
          import sys
          sys.path.insert(0, '/app')
          from importlib.metadata import entry_points
          eps = [e.name for e in entry_points(group='scrapping_service.plugins')]
          assert 'test-plugin' in eps, f'Entry points: {eps}'
          print('Entry point discovered:', eps)
          from app.plugin_api import PLUGIN_API_VERSION, Plugin
          from app.plugins.loader import load_plugins
          from app.core.config import Settings
          import httpx
          result = load_plugins(Settings(), http_client=httpx.AsyncClient())
          assert 'test-plugin' in result.loaded, f'Loaded: {result.loaded}, skipped: {result.skipped}'
          print('Plugin loaded successfully:', result.loaded)
          "

      - name: Verify image labels
        run: |
          docker inspect ghcr.io/javiyt/scrapping-service:latest --format='{{index .Config.Labels "org.scrapping-service.plugin-api-version"}}'
          docker inspect ghcr.io/javiyt/scrapping-service:latest --format='{{index .Config.Labels "org.opencontainers.image.source"}}'