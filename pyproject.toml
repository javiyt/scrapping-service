[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper-api"
version = "1.0.0"
description = "Containerized scraping API service for fetching rendered HTML from URLs"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "httpx>=0.27.0",
    "pyyaml>=6.0.3",
    "botasaurus>=4.0.97,<5.0.0",
    "selenium>=4.52.0",
    "beautifulsoup4>=4.15.0",
    "yt-dlp==2026.10.26",
    "youtube-transcript-api>=1.2.5,<2.0.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9.0,<2"]

[project.scripts]
scrapping-service = "app.run:main"
scrapping-service-mcp = "app.mcp.entrypoints:main"
scrapping-service-mcp-http = "app.mcp.entrypoints:main_http"

[project.entry-points."scrapping_service.plugins"]
# v1: no built-in plugins; this group is for third-party packages.

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "examples/templates/scrapping-plugin-cookiecutter/**/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=77",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "tests/*",
]

[tool.coverage.report]
fail_under = 77
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]