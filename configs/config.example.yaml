# =============================================================================
# Scraper API — Example configuration
# =============================================================================
# Copy this file to configs/config.yaml and adjust as needed.
#
# All values can be overridden at runtime via environment variables:
#   SCRAPER_SERVER_PORT, SCRAPER_CACHE_SQLITE_PATH, etc.
# =============================================================================

# ------------------------------------------------------------------- Server
server:
  host: 0.0.0.0
  port: 8080
  api_key_required: true
  cors_origins:
    - "*"

# --------------------------------------------------------------------- Auth
# Multi-key authentication.
#
# In the initial shared-config mode, each item in ``api_keys`` is an API key
# and all keys use the same global configuration.
#
# Environment variable expansion is supported:
#   - ${SCRAPER_API_KEY_PARTNER}
#
# If the referenced env var is not set, the profile is silently disabled
# (a warning is logged — the secret placeholder is never exposed).
#
# Future profile mode is also supported by using objects with ``name``, ``key``,
# ``enabled`` and optional ``overrides``.
#
# Profiles can only override these sections:
#   cache, scraper, security, domains, debug, browser, jobs
#
# These sections are FORBIDDEN and will cause a startup error:
#   server, auth, config_path, log_level
auth:
  default_profile: default
  expose_profile_in_response: false
  api_keys:
    - ${SCRAPER_API_KEY}
    # - ${SCRAPER_API_KEY_PARTNER}
    # - ${SCRAPER_API_KEY_BATCH}
    #
    # Future per-key profile configuration:
    # - name: exampleprofile
    #   key: ${SCRAPER_API_KEY_EXAMPLEPROFILE}
    #   description: Example profile
    #   enabled: true
    #   overrides:
    #     scraper:
    #       default_mode: browser
    #       timeout_seconds: 60
    #       max_concurrency: 1
    #     cache:
    #       default_ttl_seconds: 21600
    #       stale_if_error: true
    #     security:
    #       allowed_domains:
    #         - example.com
    #         - www.example.com
    #     domains:
    #       example.com:
    #         allowed: true
    #         min_delay_seconds: 6
    #         max_concurrent_requests: 1
    #         default_ttl_seconds: 21600
    #       www.example.com:
    #         allowed: true
    #         min_delay_seconds: 6
    #         max_concurrent_requests: 1
    #         default_ttl_seconds: 21600
    # - name: debug
    #   key: ${SCRAPER_API_KEY_DEBUG}
    #   description: Temporary debug profile
    #   enabled: false
    #   overrides:
    #     debug:
    #       screenshots: true
    #       html_dumps: true
    #     cache:
    #       default_ttl_seconds: 300

# -------------------------------------------------------------------- Cache
cache:
  backend: sqlite
  sqlite_path: data/scraper-cache.db
  default_ttl_seconds: 21600          # 6 hours
  max_html_size_mb: 10                # Truncate responses larger than this
  stale_if_error: true                # Serve expired cache on fetch failure

  # Cache maintenance — automatic cleanup to prevent unbounded growth.
  cleanup_enabled: true               # Enable automatic background cleanup
  cleanup_interval_seconds: 3600      # Run cleanup every hour
  delete_expired_after_seconds: 86400 # Delete entries expired >24h ago
  max_entries: 10000                  # Max cache rows before eviction
  max_size_mb: 512                    # Approximate max DB size
  vacuum_after_cleanup: false         # Skip VACUUM by default (can block writes)

# ----------------------------------------------------------------- Scraper
scraper:
  default_mode: auto                  # http | browser | auto
  headless: true
  timeout_seconds: 45
  max_concurrency: 1
  user_agent_profile: desktop_es

# ---------------------------------------------------------------- Browser
browser:
  # Browser backend selection.  Botasaurus is the *primary* engine; the
  # fallback list is a bounded, operator-configured set.  When the primary
  # fails with an *appropriate* error (driver crash/timeout/blocked page)
  # the orchestrator tries each fallback exactly once.  Camofox is the
  # shipped option: it participates only when it is listed here *and* the
  # top-level `camofox:` section is enabled.  Leave `fallback_backends: []`
  # for the historical behaviour (primary only, no fallback).
  primary_backend: botasaurus
  fallback_backends: []
  # To enable the Camofox fallback:
  #   fallback_backends: ["camofox"]
  # Release Chromium after this many idle seconds. Set 0 to keep it alive
  # until shutdown. Lower values reduce Raspberry Pi memory/CPU residency.
  idle_timeout_seconds: 300
  # Optional hard recycle after N browser fetches. Leave null to disable.
  max_uses: null
  # Maximum number of distinct browser configurations kept resident.
  # Keep this at 1 on Raspberry Pi deployments.
  max_pool_size: 1
  arguments:
    - "--headless=new"
    - "--no-sandbox"
    - "--disable-dev-shm-usage"
    - "--disable-gpu"
    - "--disable-background-networking"
    - "--disable-extensions"
    - "--disable-sync"
    - "--disable-default-apps"
    - "--disable-component-update"
    - "--metrics-recording-only"
    - "--mute-audio"
    - "--no-first-run"
    - "--no-default-browser-check"
    - "--window-size=1366,768"

# ------------------------------------------------------------------ Proxy
# Global proxy configuration.  All requests will be routed through this
# proxy when ``enabled`` is true, unless overridden per-request (requires
# ``allow_request_override: true``).
proxy:
  enabled: false
  url: null                               # e.g. http://user:pass@proxy.example:8080
  country: null                            # e.g. ES (provider hint)
  allow_request_override: false            # When false, per-request proxy config is rejected
  block_private_proxy_hosts: true          # Reject proxies on private/localhost IPs

# --------------------------------------------------------------- Security
security:
  block_private_ips: true
  block_localhost: true
  allowed_domains: []                 # Empty = allow all non-private domains

# ---------------------------------------------------------------- Domains
# Per-domain overrides.  Any key here can appear in "allowed_domains".
domains:
  example.com:
    allowed: true
    min_delay_seconds: 5
    max_concurrent_requests: 1
    default_ttl_seconds: 21600

# ------------------------------------------------------------------ Debug
debug:
  screenshots: false
  html_dumps: false
  dir: debug

# ------------------------------------------------------------------- Health
health:
  # /health/deep returns 503 after this many scrape failures in a row.
  # The Quadlet healthcheck uses that endpoint, so hitting this threshold
  # restarts the container through HealthOnFailure=kill + Restart=always.
  max_consecutive_scrape_errors: 5

# ------------------------------------------------------------------- Search
# Search providers implementing the provider-agnostic search contract
# (app/search/).  This block is parsed by the search provider factory;
# nested string values support ${ENV_VAR} expansion.
#
# SearXNG (first backend).  Requires the JSON output format to be enabled
# on the SearXNG instance (search.formats: [html, json] in its settings.yml).
# The provider queries /config to discover enabled categories and engines
# and caches that discovery for config_cache_ttl_seconds.
#
# Environment variable overrides: SCRAPER_SEARCH_SEARXNG_ENABLED,
# SCRAPER_SEARCH_SEARXNG_BASE_URL, SCRAPER_SEARCH_SEARXNG_TIMEOUT_SECONDS,
# SCRAPER_SEARCH_SEARXNG_DEFAULT_LANGUAGE,
# SCRAPER_SEARCH_SEARXNG_CONFIG_CACHE_TTL_SECONDS
search:
  # Routing policy (see SearchRouter):
  #   default_provider: how requests with `provider: auto` are handled.
  #                     `auto` = capability-aware routing with fallback;
  #                     or an explicit provider name (no fallback).
  #   provider_order:   routing priority for auto mode. Only registered
  #                     providers are used; unknown names are ignored with a
  #                     warning.
  #   probe_timeout_seconds: bound for the capabilities/health probe.
  default_provider: auto
  provider_order:
    - searxng
    - camofox
  probe_timeout_seconds: 10
  # Result cache (provider-agnostic — sits above the providers, shared by
  # all of them; entries are normalized search responses, not raw provider
  # payloads).  Requests may override the TTL per request via
  # `cache_ttl_seconds`, and bypass it via `force_refresh`.
  #   enabled:             master switch for the search result cache
  #   default_ttl_seconds: TTL when the request sets no cache_ttl_seconds
  #                        (0 = entries never expire on their own)
  #   stale_if_error:      serve an expired entry when the live search fails
  #                        with a retryable provider error (an invalid
  #                        request is never masked by stale data)
  # Environment variable overrides: SCRAPER_SEARCH_CACHE_ENABLED,
  # SCRAPER_SEARCH_CACHE_DEFAULT_TTL_SECONDS, SCRAPER_SEARCH_CACHE_STALE_IF_ERROR
  cache:
    enabled: true
    default_ttl_seconds: 900
    stale_if_error: true
  providers:
    searxng:
      enabled: false
      base_url: null                  # e.g. http://searxng:8080
      timeout_seconds: 15
      default_language: null           # e.g. en or en-US (used when a request has none)
      config_cache_ttl_seconds: 3600   # 0 = re-discover on every use
    camofox:
      # Camofox search (Google / Reddit / YouTube through the Camofox search
      # macros: web→google, social→reddit, videos→youtube; sources map 1:1).
      # Requires the top-level `camofox` section (the shared REST client)
      # to be enabled as well — base_url and keys live there, not here.
      # Environment variable overrides: SCRAPER_SEARCH_CAMOFOX_ENABLED,
      # SCRAPER_SEARCH_CAMOFOX_MAX_RESULTS
      enabled: false
      max_results: null               # optional documented result cap (1-100)

# ------------------------------------------------------------------ Camofox
# Reusable client for the external Camofox browser REST service
# (camofox-browser, default port 9377).  Camofox is never embedded in this
# service: all browser automation goes through this HTTP client
# (see app/camofox).  The REST API is consumed — not the MCP server.
#
#   enabled:          master switch (client is built only when true)
#   base_url:        e.g. http://camofox:9377
#   timeout_seconds:  per-request timeout for browser operations
#   access_key:       general-purpose key (most routes)
#   api_key:          elevated key (sensitive routes, e.g. cookie import)
#   user_id_prefix:   prefix for generated Camofox userId values
#
# Secrets must come from the environment (${CAMOFOX_ACCESS_KEY} /
# ${CAMOFOX_API_KEY}); a variable that is not set is treated as "unset".
#
# Environment variable overrides: SCRAPER_CAMOFOX_ENABLED,
# SCRAPER_CAMOFOX_BASE_URL, SCRAPER_CAMOFOX_TIMEOUT_SECONDS,
# SCRAPER_CAMOFOX_ACCESS_KEY, SCRAPER_CAMOFOX_API_KEY,
# SCRAPER_CAMOFOX_USER_ID_PREFIX
camofox:
  enabled: false
  base_url: null                    # e.g. http://camofox:9377
  timeout_seconds: 60
  access_key: null                  # e.g. ${CAMOFOX_ACCESS_KEY}
  api_key: null                     # e.g. ${CAMOFOX_API_KEY}
  user_id_prefix: scrapping-service

# ------------------------------------------------------------------ Transcript
# Provider-agnostic YouTube transcript API (GET /v1/transcript).  Routing
# policy + result cache follow the `search:` conventions above.
#   default_provider:       how `provider: auto` requests route (`auto` or a name)
#   provider_order:         routing priority for auto mode
#   probe_timeout_seconds:  bound for the provider health probe
#   cache.*:                result cache (see `search.cache`)
#   providers.camofox:      Camofox transcript provider (POST /youtube/transcript).
#                           Connection settings (base_url, keys, timeout) live in
#                           the top-level `camofox:` section; reused when enabled.
#   providers.youtube-transcript-api: youtube-transcript-api library, the first
#                           non-Camofox fallback (plain HTTP; run in worker threads).
#                           Requires `youtube-transcript-api` in requirements.txt.
#   providers.yt-dlp:       yt-dlp library, the last fallback in the chain.
#                           Requires `yt-dlp` in requirements.txt when enabled.
# Environment variable overrides: SCRAPER_TRANSCRIPT_* / SCRAPER_TRANSCRIPT_CAMOFOX_* /
#                                 SCRAPER_TRANSCRIPT_YT_TRANS_API_* /
#                                 SCRAPER_TRANSCRIPT_YT_DLP_*
transcript:
  default_provider: auto
  provider_order:
    - camofox
    - youtube-transcript-api
    - yt-dlp
  probe_timeout_seconds: 10
  cache:
    enabled: true
    default_ttl_seconds: 3600
    stale_if_error: true
  providers:
    camofox:
      enabled: false
      timeout_seconds: null           # override camofox.timeout_seconds for transcripts
      health_probe: true
    youtube-transcript-api:
      enabled: false                  # first non-Camofox fallback in the chain
      timeout_seconds: 30             # bound for transcript list + caption retrieval
      proxy: null                     # e.g. http://proxy.example:8080 (off by default)
    yt-dlp:
      enabled: false                  # last fallback in the chain
      timeout_seconds: 60             # bound for extract_info + caption download
      proxy: null                     # e.g. http://proxy.example:8080 (off by default)
      cookies: null                   # optional Netscape cookies file (off by default)

# ------------------------------------------------------------------ Agent browser
# Interactive, stateful browsing API (POST /v1/browser/sessions, tabs, snapshot,
# click, type, navigate, evaluate).  Camofox is the first backend; Botasaurus
# remains the stateless *scrape* backend only.  Off by default — interactive
# browsing is more sensitive than scraping.  Requires the `camofox:` client to
# be enabled.  Profiles may override this section per key.
#
#   enabled:                master switch for /v1/browser
#   allow_evaluate:         enable JavaScript evaluation (off by default)
#   max_sessions:           max active sessions per profile
#   max_tabs_per_session:   max open tabs per session
#   session_ttl_seconds:    idle TTL before a session is released
#   cleanup_interval_seconds: how often the sweeper runs
#   operation_timeout_seconds: per-operation timeout
# Environment variable overrides: SCRAPER_AGENT_BROWSER_* (same keys, upper-case)
agent_browser:
  enabled: false
  allow_evaluate: false
  max_sessions: 5
  max_tabs_per_session: 3
  session_ttl_seconds: 1800
  cleanup_interval_seconds: 60
  operation_timeout_seconds: 30

# ---------------------------------------------------------------- Logging
log_level: INFO

# ---------------------------------------------------------------- Plugins
# Automatic plugin installation at container start via SCRAPER_PLUGINS.
# See docs/plugins.md for full documentation.
#
# plugin:
#   enabled: true                     # Load plugins on startup
#   allowlist: []                     # If non-empty, only allowlisted plugins are loaded
#
# Environment variables:
#   SCRAPER_PLUGINS_PLUGINS           Comma/space-separated pip specifiers
#   SCRAPER_PLUGINS_DIR               Plugin installation directory (default: /app/plugins)
#   SCRAPER_PLUGINS_CONSTRAINTS       Constraints file (default: /app/requirements.txt)
#   SCRAPER_PLUGINS_INDEX_URL         Primary PyPI index URL
#   SCRAPER_PLUGINS_EXTRA_INDEX_URL   Extra PyPI index URL
#   SCRAPER_PLUGINS_REQUIREMENTS_FILE Requirements file (supports --hash)
#   SCRAPER_PLUGINS_OFFLINE           Install from wheelhouse only
#   SCRAPER_PLUGINS_WHEELHOUSE      Local wheelhouse directory
#   SCRAPER_PLUGINS_ON_ERROR          Fail policy: fail|warn (default: fail)
plugin:
  enabled: true
  allowlist: []
