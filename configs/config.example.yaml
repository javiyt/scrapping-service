# =============================================================================
# Scraper API — Example configuration
# =============================================================================
# Copy this file to configs/config.yaml and adjust as needed.
#
# All values can be overridden at runtime via environment variables:
#   SCRAPER_SERVER_PORT, SCRAPER_CACHE_SQLITE_PATH, etc.
# =============================================================================

# ------------------------------------------------------------------- Server
server:
  host: 0.0.0.0
  port: 8080
  api_key_required: true
  cors_origins:
    - "*"

# --------------------------------------------------------------------- Auth
# Multi-key authentication.
#
# In the initial shared-config mode, each item in ``api_keys`` is an API key
# and all keys use the same global configuration.
#
# Environment variable expansion is supported:
#   - ${SCRAPER_API_KEY_PARTNER}
#
# If the referenced env var is not set, the profile is silently disabled
# (a warning is logged — the secret placeholder is never exposed).
#
# Future profile mode is also supported by using objects with ``name``, ``key``,
# ``enabled`` and optional ``overrides``.
#
# Profiles can only override these sections:
#   cache, scraper, security, domains, debug, browser, jobs
#
# These sections are FORBIDDEN and will cause a startup error:
#   server, auth, config_path, log_level
auth:
  default_profile: default
  expose_profile_in_response: false
  api_keys:
    - ${SCRAPER_API_KEY}
    # - ${SCRAPER_API_KEY_PARTNER}
    # - ${SCRAPER_API_KEY_BATCH}
    #
    # Future per-key profile configuration:
    # - name: exampleprofile
    #   key: ${SCRAPER_API_KEY_EXAMPLEPROFILE}
    #   description: Example profile
    #   enabled: true
    #   overrides:
    #     scraper:
    #       default_mode: browser
    #       timeout_seconds: 60
    #       max_concurrency: 1
    #     cache:
    #       default_ttl_seconds: 21600
    #       stale_if_error: true
    #     security:
    #       allowed_domains:
    #         - example.com
    #         - www.example.com
    #     domains:
    #       example.com:
    #         allowed: true
    #         min_delay_seconds: 6
    #         max_concurrent_requests: 1
    #         default_ttl_seconds: 21600
    #       www.example.com:
    #         allowed: true
    #         min_delay_seconds: 6
    #         max_concurrent_requests: 1
    #         default_ttl_seconds: 21600
    # - name: debug
    #   key: ${SCRAPER_API_KEY_DEBUG}
    #   description: Temporary debug profile
    #   enabled: false
    #   overrides:
    #     debug:
    #       screenshots: true
    #       html_dumps: true
    #     cache:
    #       default_ttl_seconds: 300

# -------------------------------------------------------------------- Cache
cache:
  backend: sqlite
  sqlite_path: data/scraper-cache.db
  default_ttl_seconds: 21600          # 6 hours
  max_html_size_mb: 10                # Truncate responses larger than this
  stale_if_error: true                # Serve expired cache on fetch failure

  # Cache maintenance — automatic cleanup to prevent unbounded growth.
  cleanup_enabled: true               # Enable automatic background cleanup
  cleanup_interval_seconds: 3600      # Run cleanup every hour
  delete_expired_after_seconds: 86400 # Delete entries expired >24h ago
  max_entries: 10000                  # Max cache rows before eviction
  max_size_mb: 512                    # Approximate max DB size
  vacuum_after_cleanup: false         # Skip VACUUM by default (can block writes)

# ----------------------------------------------------------------- Scraper
scraper:
  default_mode: auto                  # http | browser | auto
  headless: true
  timeout_seconds: 45
  max_concurrency: 1
  user_agent_profile: desktop_es

# ---------------------------------------------------------------- Browser
browser:
  # Release Chromium after this many idle seconds. Set 0 to keep it alive
  # until shutdown. Lower values reduce Raspberry Pi memory/CPU residency.
  idle_timeout_seconds: 300
  # Optional hard recycle after N browser fetches. Leave null to disable.
  max_uses: null
  # Maximum number of distinct browser configurations kept resident.
  # Keep this at 1 on Raspberry Pi deployments.
  max_pool_size: 1
  arguments:
    - "--headless=new"
    - "--no-sandbox"
    - "--disable-dev-shm-usage"
    - "--disable-gpu"
    - "--disable-background-networking"
    - "--disable-extensions"
    - "--disable-sync"
    - "--disable-default-apps"
    - "--disable-component-update"
    - "--metrics-recording-only"
    - "--mute-audio"
    - "--no-first-run"
    - "--no-default-browser-check"
    - "--window-size=1366,768"

# ------------------------------------------------------------------ Proxy
# Global proxy configuration.  All requests will be routed through this
# proxy when ``enabled`` is true, unless overridden per-request (requires
# ``allow_request_override: true``).
proxy:
  enabled: false
  url: null                               # e.g. http://user:pass@proxy.example:8080
  country: null                            # e.g. ES (provider hint)
  allow_request_override: false            # When false, per-request proxy config is rejected
  block_private_proxy_hosts: true          # Reject proxies on private/localhost IPs

# --------------------------------------------------------------- Security
security:
  block_private_ips: true
  block_localhost: true
  allowed_domains: []                 # Empty = allow all non-private domains

# ---------------------------------------------------------------- Domains
# Per-domain overrides.  Any key here can appear in "allowed_domains".
domains:
  example.com:
    allowed: true
    min_delay_seconds: 5
    max_concurrent_requests: 1
    default_ttl_seconds: 21600

# ------------------------------------------------------------------ Debug
debug:
  screenshots: false
  html_dumps: false
  dir: debug

# ------------------------------------------------------------------- Health
health:
  # /health/deep returns 503 after this many scrape failures in a row.
  # The Quadlet healthcheck uses that endpoint, so hitting this threshold
  # restarts the container through HealthOnFailure=kill + Restart=always.
  max_consecutive_scrape_errors: 5

# ------------------------------------------------------------------- Search
# Search providers implementing the provider-agnostic search contract
# (app/search/).  This block is parsed by the search provider factory;
# nested string values support ${ENV_VAR} expansion.
#
# SearXNG (first backend).  Requires the JSON output format to be enabled
# on the SearXNG instance (search.formats: [html, json] in its settings.yml).
# The provider queries /config to discover enabled categories and engines
# and caches that discovery for config_cache_ttl_seconds.
#
# Environment variable overrides: SCRAPER_SEARCH_SEARXNG_ENABLED,
# SCRAPER_SEARCH_SEARXNG_BASE_URL, SCRAPER_SEARCH_SEARXNG_TIMEOUT_SECONDS,
# SCRAPER_SEARCH_SEARXNG_DEFAULT_LANGUAGE,
# SCRAPER_SEARCH_SEARXNG_CONFIG_CACHE_TTL_SECONDS
search:
  # Routing policy (see SearchRouter):
  #   default_provider: how requests with `provider: auto` are handled.
  #                     `auto` = capability-aware routing with fallback;
  #                     or an explicit provider name (no fallback).
  #   provider_order:   routing priority for auto mode. Only registered
  #                     providers are used; unknown names (e.g. a future
  #                     `camofox`) are ignored with a warning.
  #   probe_timeout_seconds: bound for the capabilities/health probe.
  default_provider: auto
  provider_order:
    - searxng
    # - camofox
  probe_timeout_seconds: 10
  providers:
    searxng:
      enabled: false
      base_url: null                  # e.g. http://searxng:8080
      timeout_seconds: 15
      default_language: null           # e.g. en or en-US (used when a request has none)
      config_cache_ttl_seconds: 3600   # 0 = re-discover on every use

# ---------------------------------------------------------------- Logging
log_level: INFO
